<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Không tìm thấy trang | StockSense</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<style>
  body{margin:0;font-family:'Sora',sans-serif;color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;background:linear-gradient(135deg,#dbeafe 0%,#eff6ff 40%,#f0f9ff 100%);display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box;}
  .bg-svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5;z-index:0;}
  .err-card{position:relative;z-index:2;width:100%;max-width:480px;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(37,99,235,.18);padding:44px 40px;text-align:center;box-sizing:border-box;}
  .err-icon{width:72px;height:72px;border-radius:50%;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;color:var(--accent);}
  .err-card h1{font-size:22px;font-weight:700;margin:14px 0 8px;}
  .err-card p{font-size:14px;color:var(--muted);line-height:1.7;margin:0 0 26px;}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .search-box{position:relative;margin-bottom:22px;}
  .search-box input{width:100%;padding:12px 14px 12px 42px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;outline:none;box-sizing:border-box;font-family:'Sora',sans-serif;background:#f8fafc;}
  .search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);}
</style>
</head>
<body>
<svg class="bg-svg" preserveAspectRatio="none" viewBox="0 0 1400 800">
  <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#93c5fd" stop-opacity=".4"/><stop offset="1" stop-color="#bae6fd" stop-opacity="0"/></linearGradient></defs>
  <rect x="0" y="520" width="1400" height="280" fill="url(#g1)"/>
  <g stroke="#3b82f6" stroke-width="1" opacity=".25"><line x1="0" y1="560" x2="1400" y2="560"/><line x1="0" y1="620" x2="1400" y2="620"/><line x1="0" y1="700" x2="1400" y2="700"/></g>
  <circle cx="700" cy="120" r="3" fill="#60a5fa" opacity=".5"/>
  <circle cx="1100" cy="220" r="3" fill="#38bdf8" opacity=".5"/>
</svg>
<div class="err-card reveal">
  <div class="err-icon">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
  </div>
  <div class="err-code">404</div>
  <h1>Không tìm thấy trang</h1>
  <p>Trang bạn đang tìm kiếm có thể đã bị di chuyển, đổi tên hoặc không tồn tại. Kiểm tra lại đường dẫn hoặc quay lại bảng điều khiển.</p>
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" placeholder="Tìm kiếm trang, SKU, báo cáo..." onkeydown="if(event.key==='Enter'){window.location.href='dashboard.html';}">
  </div>
  <div class="btn-row">
    <a href="dashboard.html" class="btn btn-primary">Quay lại bảng điều khiển</a>
    <button class="btn btn-ghost" onclick="history.back()">Trang trước</button>
  </div>
  <div class="auth-foot" style="margin-top:22px;"><a class="link" href="index.html">Đăng xuất / về trang đăng nhập</a></div>
</div>
</body>
</html>
