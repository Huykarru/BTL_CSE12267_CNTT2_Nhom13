<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StockSense - Điều hành tồn kho</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app-shell.css">
<style>
  body{margin:0;font-family:'Sora',sans-serif;color:var(--text);background:#f1f5f9;min-height:100vh;}
  .layout{display:flex;flex-wrap:wrap;min-height:100vh;}
  .sidebar{width:240px;min-width:240px;background:#fff;border-right:1px solid var(--border);padding:20px 14px;box-sizing:border-box;}
  .sidebar-logo{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--border);margin-bottom:16px;}
  .sidebar-logo .name{font-weight:700;font-size:15px;line-height:1.2;}
  .sidebar-logo .sub{font-size:10px;color:var(--muted);}
  #navMenu{display:flex;flex-direction:column;gap:4px;}
  .ai-box{margin-top:24px;padding:14px;background:var(--accent-soft);border-radius:12px;}
  .ai-box .t{font-size:12px;font-weight:600;margin-bottom:4px;}
  .ai-box .d{font-size:11px;color:var(--muted);margin-bottom:10px;}
  .ai-box button{width:100%;padding:8px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Sora',sans-serif;}
  main{flex:1;min-width:300px;padding:24px 28px;box-sizing:border-box;}
  .topbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);}
  .topbar h2{font-size:22px;font-weight:700;margin:0;}
  .topbar p{font-size:13px;color:var(--muted);margin:4px 0 0;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .user-info{text-align:right;}
  .user-info .n{font-size:14px;font-weight:600;}
  .user-info .r{font-size:11px;color:var(--muted);}
  .avatar{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .logout-btn{padding:8px 14px;background:#fff;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Sora',sans-serif;transition:all .15s;}
  .logout-btn:hover{color:var(--danger);border-color:var(--danger);}
  #modalRoot{position:relative;}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <svg width="32" height="32" viewBox="0 0 56 56" fill="none"><path d="M28 6L48 16V40L28 50L8 40V16L28 6Z" stroke="#1e3a8a" stroke-width="3" fill="#eff6ff"/><rect x="18" y="30" width="8" height="8" rx="1.5" fill="#2563eb"/><rect x="28" y="34" width="8" height="8" rx="1.5" fill="#3b82f6"/></svg>
      <div>
        <div class="name">StockSense</div>
        <div class="sub">Điều hành tồn kho</div>
      </div>
    </div>
    <div id="navMenu"></div>
    <div class="ai-box">
      <div class="t">AI Assistant</div>
      <div class="d">3 tính năng AI sẵn sàng</div>
      <button onclick="switchTab('ai')">Mở AI Panel</button>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h2 id="pageTitle">Bảng điều khiển</h2>
        <p id="pageSub">Tổng quan hoạt động kho hàng</p>
      </div>
      <div class="topbar-right">
        <a class="icon-btn" id="notifBell" href="notifications.html" title="Thông báo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></a>
        <a class="icon-btn" href="settings.html" title="Cài đặt"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></a>
        <div class="user-info">
          <div class="n" id="userName"></div>
          <div class="r" id="userRole"></div>
        </div>
        <a href="profile.html" style="text-decoration:none;" title="Hồ sơ cá nhân"><div class="avatar" id="avatar"></div></a>
        <button class="logout-btn" onclick="logout()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Đăng xuất
        </button>
      </div>
    </div>
    <div id="contentArea"></div>
  </main>
</div>
<div id="modalRoot"></div>

<script src="js/data.js"></script>
<script src="js/utils.js"></script>
<script src="js/storage.js"></script>
<script src="js/ai.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
